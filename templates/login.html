{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">

    <div class="cartao">
      <h1 class="h4 mb-1">Entrar</h1>
      <p class="texto-suave small mb-4">
        Monte seu plano alimentar a partir dos seus próprios números.
      </p>

      {% if erro %}
        <div class="alert alert-danger py-2">{{ erro }}</div>
      {% endif %}

      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-control" type="email" id="email" name="email"
                 value="{{ email or '' }}" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label" for="senha">Senha</label>
          <input class="form-control" type="password" id="senha" name="senha" required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="lembrar"
                 name="lembrar" value="sim">
          <label class="form-check-label small" for="lembrar">
            Manter conectado neste computador
          </label>
        </div>

        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>

      <p class="text-center mt-4 mb-0 small">
        Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
